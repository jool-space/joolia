name: Upstream sync

on:
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Plan, propose a sync, review without publishing, or probe the action
        type: choice
        options: [plan, propose, review, probe]
        default: plan

permissions:
  contents: read

concurrency:
  group: ${{ (inputs.mode == 'probe' || inputs.mode == 'review') && format('joolia-upstream-diagnostic-{0}-{1}', inputs.mode, github.ref) || 'joolia-upstream-sync' }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  PYTHONDONTWRITEBYTECODE: 1
  SYNC_DIR: ${{ github.workspace }}-upstream-sync-data
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  plan:
    if: >-
      (github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'probe' || inputs.mode == 'review'))) &&
      (github.event_name != 'schedule' || vars.JOOLIA_UPSTREAM_SYNC_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      status: ${{ steps.plan.outputs.status }}
      branch: ${{ steps.plan.outputs.branch }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the batch planner
        run: python3 -m unittest discover -s contrib/upstream-sync -p 'test_*.py' -v
      - name: Pin a bounded upstream batch
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags https://github.com/JuliaLang/julia.git master
          python3 contrib/upstream-sync/sync.py plan --upstream FETCH_HEAD --out "$SYNC_DIR"
          python3 contrib/upstream-sync/publish.py gate --data "$SYNC_DIR"
          cat "$SYNC_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Assign one review job per incoming commit
        id: matrix
        env:
          MODE: ${{ inputs.mode }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          plan = json.loads((Path(os.environ['SYNC_DIR']) / 'plan.json').read_text())
          shas = [c['sha'] for c in plan['commits']] if os.environ['MODE'] != 'probe' else ['probe']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'sha': shas or ['idle']}) + '\n')
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-plan
          path: ${{ env.SYNC_DIR }}/plan.json
          retention-days: 30

  agent:
    needs: plan
    if: >-
      (needs.plan.outputs.status == 'ready' && (github.event_name == 'schedule' || inputs.mode == 'propose' || inputs.mode == 'review')) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'probe')
    runs-on: ubuntu-24.04
    name: Review ${{ matrix.sha }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upstream-plan
          path: ${{ env.SYNC_DIR }}
      - name: Verify agent credentials are configured
        env:
          API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$API_KEY" ]]; then
            echo 'Configure the OPENAI_API_KEY Actions secret before proposing a sync.' >&2
            exit 1
          fi
      - name: Prepare the pinned source tree and trusted prompt
        if: inputs.mode != 'probe'
        env:
          REVIEW_SHA: ${{ matrix.sha }}
        run: |
          UPSTREAM_SHA=$(python3 -c 'import json,os; print(json.load(open(os.environ["SYNC_DIR"]+"/plan.json"))["fetched_sha"])')
          git fetch --no-tags https://github.com/JuliaLang/julia.git "$UPSTREAM_SHA"
          cp contrib/upstream-sync/review.schema.json "$SYNC_DIR/review.schema.json"
          python3 contrib/upstream-sync/sync.py prepare --out "$SYNC_DIR" --review-sha "$REVIEW_SHA"
      - name: Prepare a minimal action probe
        if: inputs.mode == 'probe'
        run: |
          python3 - <<'PYCODE'
          import json, os, secrets
          from pathlib import Path
          folder = Path(os.environ['SYNC_DIR'])
          challenge = Path('.cache/upstream-sync-probe.txt')
          challenge.parent.mkdir(exist_ok=True)
          challenge.write_text(secrets.token_hex(16))
          (folder / 'prompt.md').write_text('Read .cache/upstream-sync-probe.txt with a shell tool. '
              'Then use the apply_patch tool to create .cache/upstream-sync-probe-copy.txt with the same contents. '
              'Do not edit other files or run other commands. Return JSON with status="ok" and proof equal to the file contents. '
              'If either tool fails, return status="failed" and proof=""; do not retry or use a different editing tool.')
          schema = {'type': 'object', 'properties': {'status': {'type': 'string', 'enum': ['ok', 'failed']},
                    'proof': {'type': 'string'}}, 'required': ['status', 'proof'], 'additionalProperties': False}
          (folder / 'review.schema.json').write_text(json.dumps(schema))
          PYCODE
      - name: Arm independent review deadline
        env:
          WATCH_SECONDS: ${{ inputs.mode == 'probe' && '180' || '480' }}
        run: |
          WATCH_DIR=$(sudo mktemp -d /tmp/joolia-review-watchdog.XXXXXX)
          sudo chmod 755 "$WATCH_DIR"
          sudo install -m 555 contrib/upstream-sync/review_watchdog.py "$WATCH_DIR/watchdog.py"
          echo "WATCH_DIR=$WATCH_DIR" >> "$GITHUB_ENV"
          sudo -n setsid python3 "$WATCH_DIR/watchdog.py" \
            --marker "$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" --seconds "$WATCH_SECONDS" \
            --status "$WATCH_DIR/status.json" --stop "$SYNC_DIR/watchdog.stop" \
            </dev/null >/dev/null 2>&1 &
          WATCH_DIR="$WATCH_DIR" python3 - <<'PYCODE'
          import json, os, time
          from pathlib import Path
          status = Path(os.environ['WATCH_DIR']) / 'status.json'
          deadline = time.monotonic() + 10
          while not status.exists():
              if time.monotonic() > deadline:
                  raise SystemExit('Review watchdog did not start')
              time.sleep(0.1)
          plan = json.loads((Path(os.environ['SYNC_DIR']) / 'plan.json').read_text())
          progress = Path('.cache/upstream-sync-progress.json')
          progress.parent.mkdir(exist_ok=True)
          progress.write_text(json.dumps({'target_sha': plan['target_sha'], 'current_sha': None, 'commits': []}))
          print('Independent review deadline armed for', os.environ['WATCH_SECONDS'], 'seconds.')
          PYCODE
      - name: Review the assigned commit and adapt the merged source
        id: review
        env:
          JOOLIA_REVIEW_MARKER: ${{ github.run_id }}:${{ github.run_attempt }}
        timeout-minutes: 10
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          allow-bot-users: 'github-actions[bot]'
          codex-version: '0.155.0'
          model: gpt-5.6-luna
          effort: high
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          prompt-file: ${{ env.SYNC_DIR }}/prompt.md
          output-schema-file: ${{ env.SYNC_DIR }}/review.schema.json
          output-file: ${{ env.SYNC_DIR }}/review.json
      - name: Verify the probe exercised shell reading and patch editing
        if: inputs.mode == 'probe' && steps.review.outcome == 'success'
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['SYNC_DIR']) / 'review.json').read_text())
          expected = Path('.cache/upstream-sync-probe.txt').read_text()
          copied = Path('.cache/upstream-sync-probe-copy.txt')
          if result != {'status': 'ok', 'proof': expected} or not copied.exists() or copied.read_text().strip() != expected:
              raise SystemExit('The model responded, but the sandboxed read/edit probe failed')
          print('Model response, shell read, and apply_patch edit verified.')
          PYCODE
      - name: Retain progress and stop the deadline
        if: always()
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          touch "$SYNC_DIR/watchdog.stop"
          if [ -n "${WATCH_DIR:-}" ] && [ -f "$WATCH_DIR/status.json" ]; then
            cp "$WATCH_DIR/status.json" "$SYNC_DIR/watchdog.json"
          fi
          if [ -f .cache/upstream-sync-progress.json ]; then
            cp .cache/upstream-sync-progress.json "$SYNC_DIR/progress.json"
          fi
          git add --intent-to-add -- .
          git diff --binary HEAD > "$SYNC_DIR/adaptations.patch"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          folder = Path(os.environ['SYNC_DIR'])
          outcome = os.environ['REVIEW_OUTCOME']
          (folder / 'action-result.json').write_text(json.dumps({'outcome': outcome}))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Review action outcome: **' + outcome + '**. Progress and watchdog diagnostics are in the artifact for this commit.\n')
          PYCODE
      - name: Retain the review and proposed patch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-review-${{ matrix.sha }}
          overwrite: true
          path: |
            ${{ env.SYNC_DIR }}/review.json
            ${{ env.SYNC_DIR }}/adaptations.patch
            ${{ env.SYNC_DIR }}/merge.json
            ${{ env.SYNC_DIR }}/progress.json
            ${{ env.SYNC_DIR }}/watchdog.json
            ${{ env.SYNC_DIR }}/action-result.json
          if-no-files-found: warn
          retention-days: 30

  collect:
    needs: [plan, agent]
    if: needs.plan.outputs.status == 'ready' && inputs.mode != 'probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upstream-plan
          path: ${{ env.SYNC_DIR }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: upstream-review-*
          path: ${{ env.SYNC_DIR }}/reviews
      - name: Validate complete reviews and combine compatible adaptations
        run: |
          UPSTREAM_SHA=$(python3 -c 'import json,os; print(json.load(open(os.environ["SYNC_DIR"]+"/plan.json"))["fetched_sha"])')
          git fetch --no-tags https://github.com/JuliaLang/julia.git "$UPSTREAM_SHA"
          python3 contrib/upstream-sync/collect_reviews.py --out "$SYNC_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-review
          overwrite: true
          path: |
            ${{ env.SYNC_DIR }}/review.json
            ${{ env.SYNC_DIR }}/adaptations.patch
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [plan, collect]
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'schedule' || inputs.mode == 'propose') &&
      ((needs.plan.outputs.status == 'ready' && needs.collect.result == 'success') ||
       needs.plan.outputs.status == 'existing')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upstream-plan
          path: ${{ env.SYNC_DIR }}
      - if: needs.plan.outputs.status == 'ready'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: upstream-review
          path: ${{ env.SYNC_DIR }}
      - name: Assemble using trusted tooling from the workflow revision
        if: needs.plan.outputs.status == 'ready'
        run: |
          UPSTREAM_SHA=$(python3 -c 'import json,os; print(json.load(open(os.environ["SYNC_DIR"]+"/plan.json"))["fetched_sha"])')
          git fetch --no-tags https://github.com/JuliaLang/julia.git "$UPSTREAM_SHA"
          cp contrib/upstream-sync/sync.py "$RUNNER_TEMP/sync.py"
          cp contrib/upstream-sync/publish.py "$RUNNER_TEMP/publish.py"
          python3 "$RUNNER_TEMP/sync.py" assemble --out "$SYNC_DIR"
      - name: Publish or resume the draft PR and explicitly dispatch CI
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_STATUS: ${{ needs.plan.outputs.status }}
          JOOLIA_UPSTREAM_AUTOMERGE_ENABLED: ${{ vars.JOOLIA_UPSTREAM_AUTOMERGE_ENABLED }}
        run: |
          if [[ "$PLAN_STATUS" == existing ]]; then
            cp contrib/upstream-sync/sync.py "$RUNNER_TEMP/sync.py"
            cp contrib/upstream-sync/publish.py "$RUNNER_TEMP/publish.py"
          fi
          gh auth setup-git
          python3 "$RUNNER_TEMP/publish.py" publish --data "$SYNC_DIR" --status "$PLAN_STATUS"
